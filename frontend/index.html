<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>暗影纪元</title>
<link rel="stylesheet" href="css/style.css?v=12">
<link rel="stylesheet" href="css/platform.css?v=12">
<link rel="stylesheet" href="css/combat.css?v=12">
<link rel="stylesheet" href="css/character-panel.css?v=2">
</head>
<body>

<!-- ===== 游戏平台层（首页：分类+轮播+网格+登录） ===== -->
<div id="platform-layer">
  <div id="platform-header">
    <div class="platform-logo">暗影纪元 · 游戏平台</div>
    <div id="platform-user-area"></div>
  </div>
  <div id="platform-body">
    <!-- 轮播图 -->
    <div id="platform-carousel" class="hidden"></div>
    <!-- 分类筛选 -->
    <div id="platform-cats"></div>
    <!-- 游戏网格 -->
    <div id="platform-grid"></div>
  </div>
</div>

<!-- ===== 认证弹窗（登录/注册） ===== -->
<div id="auth-modal" class="hidden">
  <div class="auth-box">
    <button class="auth-close" id="auth-close">&times;</button>
    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="login">登录</button>
      <button class="auth-tab" data-mode="register">注册</button>
    </div>
    <div class="auth-form">
      <input type="text" id="auth-username" placeholder="用户名（至少3位）" autocomplete="off">
      <input type="password" id="auth-password" placeholder="密码（至少6位）" autocomplete="off">
      <input type="text" id="auth-nickname" placeholder="昵称（注册时填写，可留空）" autocomplete="off" style="display:none">
      <button id="auth-submit">登录</button>
      <div id="auth-msg"></div>
    </div>
  </div>
</div>

<!-- ===== 游戏开始画面弹窗（按钮配置 + 新建人物/读档） ===== -->
<div id="game-start-modal" class="hidden">
  <div id="game-start-stage"></div>
  <button class="game-start-back" id="game-start-back">← 返回</button>
</div>

<!-- ===== 通用平台弹窗（新建人物等） ===== -->
<div id="platform-modal" class="hidden">
  <div class="platform-modal-box">
    <button class="platform-modal-close" id="platform-modal-close">&times;</button>
    <div id="platform-modal-body"></div>
  </div>
</div>

<!-- 主游戏容器（默认隐藏，由 Platform._enterGame 显示） -->
<div id="game-container" style="display:none">

  <!-- 背景层 -->
  <div id="background-layer">
    <img id="bg-image" src="" alt="场景背景">
    <div id="bg-overlay"></div>
  </div>

  <!-- ===== 游戏UI层（可整体隐藏） ===== -->
    <div id="ui-layer">

      <!-- 左上角：人物HUD -->
      <div id="player-hud">
        <div id="hud-portrait" title="点击查看人物属性">
          <img id="hud-avatar" src="" alt="">
        </div>
        <div id="hud-info">
          <div class="hud-row-top">
            <div id="hud-name">艾尔文</div>
            <div id="hud-level">Lv.1</div>
          </div>
          <div class="hud-bar-row">
            <div class="hud-bar-track hp-track">
              <div class="hud-bar-fill hp-fill" id="hud-hp-fill" style="width:100%"></div>
            </div>
            <span class="hud-bar-text hp-text" id="hud-hp-text">HP 100/100</span>
          </div>
          <div class="hud-bar-row">
            <div class="hud-bar-track mp-track">
              <div class="hud-bar-fill mp-fill" id="hud-mp-fill" style="width:100%"></div>
            </div>
            <span class="hud-bar-text mp-text" id="hud-mp-text">MP 50/50</span>
          </div>
        </div>
      </div>

      <!-- 左侧菜单图标 -->
      <div id="left-menu">
        <div class="menu-icon" data-panel="character" title="人物" data-tooltip="人物属性">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="menu-icon" data-panel="inventory" title="背包" data-tooltip="背包 (I)">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 7h-4V5c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm-6 0h-4V5h4v2z"/></svg>
        </div>
        <div class="menu-icon" data-panel="map" title="地图" data-tooltip="地图 (M)">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
        </div>
        <div class="menu-icon" data-panel="menu" title="设置" data-tooltip="设置">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </div>
      </div>

    </div><!-- /ui-layer -->

    <!-- 右上角UI开关（保持在ui-layer外面，隐藏时可见） -->
    <button id="ui-toggle" title="隐藏/显示界面">•</button>

    <!-- 对话/表情层（可整体隐藏，与ui-layer同步） -->
    <div id="dialogue-overlay">

      <!-- 表情层（多人表情容器） -->
      <div id="expression-layer"></div>

      <!-- 对话框（透明，压在表情上方） -->
      <div id="dialogue-box">
        <div id="speaker-name"></div>
        <div id="dialogue-text"></div>
        <div id="dialogue-indicator">▼</div>
      </div>

    </div><!-- /dialogue-overlay -->

    <!-- 章节封面层 -->
    <div id="chapter-cover" class="hidden">
      <div id="chapter-cover-bg"></div>
      <div id="chapter-cover-content">
        <div id="chapter-cover-title"></div>
        <div id="chapter-cover-subtitle"></div>
      </div>
    </div>

    <!-- 选择分支 -->
    <div id="choices-container" class="hidden">
      <div id="choices-list"></div>
    </div>

    <!-- ===== 战斗层（回合制 v2 · 卡牌式版面） ===== -->
    <div id="battle-layer" class="hidden">
      <div id="battle-bg"></div>

      <!-- 顶部信息条：回合徽章 + 剧情台词 + 工具 -->
      <div id="battle-top">
        <div id="battle-round-badge">
          <span class="brb-label">ROUND</span>
          <span id="battle-round">第 1 回合</span>
        </div>

        <!-- 剧情台词气泡 -->
        <div id="battle-banter" class="hidden">
          <span id="banter-name"></span>
          <span id="banter-text"></span>
        </div>

        <!-- 右上工具：自动 / 跳过 -->
        <div id="battle-tools">
          <button id="btn-auto" title="自动战斗 (A)">自动 OFF</button>
          <button id="btn-skip" title="跳过演出 (空格)">跳过演出</button>
        </div>
      </div>

      <!-- 中央战斗区：敌方(上) + 我方(下)，左右一致卡牌 -->
      <section id="battle-arena">
        <div id="battle-enemies"></div>
        <div id="battle-party"></div>
      </section>

      <!-- 右侧一栏：行动顺序(上) + 战斗记录(下) -->
      <aside id="battle-side">
        <aside id="turn-order">
          <div class="to-title"><span class="to-title-line"></span>行动顺序<span class="to-title-line"></span></div>
          <div id="turn-order-list"></div>
        </aside>
        <section id="battle-log-panel">
          <div class="bl-head">
            <span class="bl-ico">◈</span>战斗记录
          </div>
          <div class="bl-body">
            <div id="battle-log"></div>
          </div>
        </section>
      </aside>

      <!-- 底部：指令区（我方/Boss 通用圆形行动 UI） -->
      <div id="battle-command">
        <div id="battle-info">
          <span id="battle-actor"></span>
          <span id="battle-hint">请选择行动</span>
        </div>
        <div id="cmd-main" class="cmd-panel">
          <button class="cmd-btn" data-cmd="attack"><b>攻击</b><i>普攻</i></button>
          <button class="cmd-btn" data-cmd="skill"><b>技能</b><i>灵力</i></button>
          <button class="cmd-btn" data-cmd="item"><b>物品</b><i>道具</i></button>
          <button class="cmd-btn" data-cmd="defend"><b>防御</b><i>减伤</i></button>
          <button class="cmd-btn ultimate" data-cmd="ultimate"><b>神通</b><i>怒气 --</i></button>
          <button class="cmd-btn" data-cmd="flee"><b>逃跑</b><i>脱离</i></button>
        </div>
        <div id="cmd-sub" class="cmd-panel hidden"></div>
      </div>

      <!-- 伤害飘字 / 特效 -->
      <div id="battle-float"></div>
      <div id="battle-banner" class="hidden"></div>

      <!-- 战斗结算 -->
      <div id="battle-result" class="hidden"></div>
    </div>

  <!-- 面板覆盖层 -->
  <div id="panel-overlay" class="hidden">
    <div id="panel-content">
      <button id="panel-close">✕</button>
      <div id="panel-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

</div><!-- /game-container -->

<script src="js/utils.js?v=12"></script>
<script src="js/api.js?v=12"></script>
<script src="js/tts.js?v=1"></script>
<script src="js/game.js?v=12"></script>
<script src="js/platform.js?v=12"></script>
<script src="js/ui/dialogue.js?v=12"></script>
<script src="js/ui/combat.js?v=12"></script>
<script src="js/ui/character.js?v=14"></script>
<script src="js/ui/map.js?v=12"></script>
<script src="js/ui/menu.js?v=12"></script>
<script src="js/app.js?v=12"></script>
</body>
</html>
